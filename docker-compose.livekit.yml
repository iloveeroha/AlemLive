services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  livekit-config:
    image: alpine:3.23
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-change-me-livekit-secret}"
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        mkdir -p /config
        cat > /config/livekit.yaml <<EOF
        port: 7880
        bind_addresses:
          - ""

        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          port_range_start: 60000
          port_range_end: 60100

        keys:
          "$${LIVEKIT_API_KEY}": "$${LIVEKIT_API_SECRET}"

        redis:
          address: redis:6379

        logging:
          level: info
        EOF

        cat > /config/egress.yaml <<EOF
        log_level: info
        api_key: "$${LIVEKIT_API_KEY}"
        api_secret: "$${LIVEKIT_API_SECRET}"
        ws_url: ws://livekit:7880
        insecure: true

        redis:
          address: redis:6379
        EOF
    volumes:
      - livekit_config:/config
    restart: "no"

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit/livekit.yaml --node-ip=${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "60000-60100:60000-60100/udp"
    volumes:
      - livekit_config:/etc/livekit:ro
    depends_on:
      redis:
        condition: service_started
      livekit-config:
        condition: service_completed_successfully
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-alemlive}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-change-me-minio-password}"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-alemlive}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-change-me-minio-password}"
      MINIO_BUCKET: "${MINIO_BUCKET:-alemlive-recordings}"
    entrypoint: /bin/sh
    command: >
      -c "until mc alias set local http://minio:9000 \"$${MINIO_ROOT_USER}\" \"$${MINIO_ROOT_PASSWORD}\"; do sleep 1; done;
      mc mb -p \"local/$${MINIO_BUCKET}\" || true;
      mc anonymous set download \"local/$${MINIO_BUCKET}\" || true"
    restart: "no"

  livekit-egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_FILE: /etc/livekit/egress.yaml
    volumes:
      - livekit_config:/etc/livekit:ro
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp=unconfined
    shm_size: "1gb"
    depends_on:
      livekit:
        condition: service_started
      livekit-config:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  minio_data:
  livekit_config:
