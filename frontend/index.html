<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>read</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(() => {
        function fallbackRandomUUID() {
          const bytes = new Uint8Array(16)
          const cryptoSource = globalThis.crypto

          if (cryptoSource && cryptoSource.getRandomValues) {
            cryptoSource.getRandomValues(bytes)
          } else {
            for (let index = 0; index < bytes.length; index += 1) {
              bytes[index] = Math.floor(Math.random() * 256)
            }
          }

          bytes[6] = (bytes[6] & 0x0f) | 0x40
          bytes[8] = (bytes[8] & 0x3f) | 0x80

          const hex = Array.from(bytes, (byte) => byte.toString(16).padStart(2, '0'))
          return `${hex.slice(0, 4).join('')}-${hex.slice(4, 6).join('')}-${hex.slice(6, 8).join('')}-${hex.slice(8, 10).join('')}-${hex.slice(10).join('')}`
        }

        if (!globalThis.crypto) {
          try {
            Object.defineProperty(globalThis, 'crypto', { configurable: true, value: {} })
          } catch {
            globalThis.crypto = {}
          }
        }

        if (!globalThis.crypto.randomUUID) {
          try {
            Object.defineProperty(globalThis.crypto, 'randomUUID', { configurable: true, value: fallbackRandomUUID })
          } catch {
            globalThis.crypto.randomUUID = fallbackRandomUUID
          }
        }
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
