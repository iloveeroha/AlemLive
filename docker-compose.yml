services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
      KC_HOSTNAME: "http://localhost:8080"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      PORT: "8080"
      ALLOWED_ORIGINS: "http://localhost:5173,https://localhost:5174"
      KEYCLOAK_ISSUER_URL: "http://localhost:8080/realms/alemlive"
      KEYCLOAK_JWKS_URL: "http://keycloak:8080/realms/alemlive/protocol/openid-connect/certs"
      KEYCLOAK_TOKEN_URL: "http://keycloak:8080/realms/alemlive/protocol/openid-connect/token"
      KEYCLOAK_CLIENT_ID: "alemlive"
      REPORTS_STORAGE_PATH: "/app/data/reports.json"
    volumes:
      - ./backend/data:/app/data
    ports:
      - "8088:8080"
    depends_on:
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
      - "5174:443"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
